<div class="flex items-center gap-md flex-1 max-w-2xl px-lg">
<div class="relative w-full">

<input class="w-full bg-surface-container-highest border-none rounded-full py-md pl-12 pr-md text-on-surface placeholder:text-on-surface-variant focus:ring-2 focus:ring-primary focus:bg-surface-container transition-colors font-body-lg text-body-lg" placeholder="Search files and folders..." type="text"/>

<div class="flex items-center gap-sm">

<div class="flex-1 overflow-hidden">

<p class="font-label-md text-label-md text-on-surface-variant">3 items</p>
</div>
</button>
<!-- Folder Card -->
<button class="flex items-center gap-md p-md bg-surface-container-low rounded-lg hover:bg-surface-container-highest transition-colors hover:shadow-md border border-transparent hover:border-primary-fixed-dim text-left group">

</button>
