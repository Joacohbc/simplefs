name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  validate:
    name: Validation and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: |
          pnpm run build:vendor
          pnpm run build:css

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

      - name: Verify build
        run: CGO_ENABLED=0 go build -trimpath -o simplefs ./cmd/simplefs
