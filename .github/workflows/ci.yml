name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  validate:
    name: Validation and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend assets
        run: |
          pnpm run build:vendor
          pnpm run build:css

      - name: Run tests
        run: go test -v ./...

      - name: Verify build
        run: go build -o simplefs ./cmd/simplefs/main.go
