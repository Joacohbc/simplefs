services:
  simplefs:
    image: ghcr.io/joacohbc/simplefs:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simplefs
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - STORAGE_DIR=/data
    volumes:
      - ./uploads:/data
